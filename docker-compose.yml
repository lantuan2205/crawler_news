version: "3.8"

services:
  app:
    build: .
    container_name: fastapi_with_cron
    ports:
      - "8000:8000"
    restart: always
    depends_on:
      - rabbitmq
    environment:
      RABBITMQ_HOST: rabbitmq

  rabbitmq:
    image: "rabbitmq:3-management"
    container_name: my_rabbitmq
    restart: always
    ports:
      - "5673:5672"    # AMQP (cho ứng dụng)
      - "15673:15672"  # Web UI (http://localhost:15672)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  worker:
    build: .
    container_name: fastapi_worker
    restart: always
    depends_on:
      - rabbitmq
      - app
    environment:
      RABBITMQ_HOST: rabbitmq
      API_URL: http://app:8000/crawl
    command: ["python", "app/worker.py"]
