version: "3.8"

services:
  app:
    build: .
    container_name: fastapi_with_cron_worker
    ports:
      - "8000:8000"
    restart: always
    depends_on:
      - rabbitmq
    environment:
      RABBITMQ_HOST: rabbitmq  # Chỉ định RabbitMQ bằng tên service

  rabbitmq:
    image: "rabbitmq:3-management"
    container_name: my_rabbitmq
    restart: always
    ports:
      - "5673:5672"    # AMQP port (cho ứng dụng)
      - "15673:15672"  # Web UI (truy cập http://localhost:15672)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
